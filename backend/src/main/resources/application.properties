spring.application.name=customer-management-system

server.port=8080

spring.datasource.url=jdbc:mariadb://localhost:3306/customer_management
spring.datasource.username=root
spring.datasource.password=Sithu@867
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB

app.bulk-import.batch-size=2000
app.bulk-import.worker-count=2
app.bulk-import.queue-capacity=10
